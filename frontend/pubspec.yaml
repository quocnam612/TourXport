name: frontend
description: TourXport - Khám phá Việt Nam

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  flutter_web_plugins:
    sdk: flutter
  google_fonts: ^8.0.2
  http: ^1.6.0
  image_picker: ^1.1.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  google_sign_in: ^7.2.0
  permission_handler: ^12.0.3
  flutter_map_cancellable_tile_provider: ^2.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  speech_to_text: ^6.6.2
  local_auth: ^3.0.1
  flutter_map_marker_cluster: ^1.3.6
  share_plus: ^7.2.2

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^3.0.0
    
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
  - family: Montserrat
    fonts:
      - asset: assets/fonts/Montserrat-Light.ttf
        weight: 300
      - asset: assets/fonts/Montserrat-Regular.ttf
        weight: 400
      - asset: assets/fonts/Montserrat-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Montserrat-ExtraBold.ttf
        weight: 800
