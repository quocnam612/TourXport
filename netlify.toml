[build]
  base = "frontend"
  publish = "build/web"
  command = """
    if [ ! -d "$HOME/flutter" ]; then git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"; fi
    export PATH="$HOME/flutter/bin:$PATH"
    flutter config --enable-web
    flutter pub get
    flutter build web --release \
      --dart-define=API_BASE_URL="$API_BASE_URL" \
      --dart-define=AI_BASE_URL="$AI_BASE_URL" \
      --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
      --dart-define=FACEBOOK_APP_ID="$FACEBOOK_APP_ID" \
      --dart-define=FACEBOOK_GRAPH_VERSION="${FACEBOOK_GRAPH_VERSION:-v20.0}"
  """

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
